plugins { id 'com.android.application' }

android {
    namespace 'com.semih.cepbutcem'
    compileSdk 35
    defaultConfig {
        applicationId 'com.semih.cepbutcem'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        resValue 'string', 'app_version', versionName
        testInstrumentationRunner 'com.semih.cepbutcem.LedgerInstrumentation'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
