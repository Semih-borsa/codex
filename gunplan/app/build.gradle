plugins { id 'com.android.application' }
def signingFile = System.getenv('GUNPLAN_SIGNING_PROPERTIES')
def signingProps = new Properties()
if (signingFile) { file(signingFile).withInputStream { signingProps.load(it) } }
android {
 namespace 'tr.gunplan.app'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'tr.gunplan.app'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2.0'; testInstrumentationRunner 'tr.gunplan.app.PlannerInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { if(signingFile) { release { storeFile file(signingProps['storeFile']); storePassword signingProps['storePassword']; keyAlias signingProps['keyAlias']; keyPassword signingProps['keyPassword'] } } }
 buildTypes { release { minifyEnabled false; if(signingFile) signingConfig signingConfigs.release }; standalone { initWith release; applicationIdSuffix '.v2' } }
}
