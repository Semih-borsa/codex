plugins { id 'com.android.application' }
android {
    namespace 'com.semih.havapusulasi'
    compileSdk 35
    defaultConfig {
        applicationId 'com.semih.havapusulasi'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.semih.havapusulasi.WeatherInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
