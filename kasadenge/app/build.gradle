plugins { id 'com.android.application' }
def signingFile = System.getenv('KASADENGE_SIGNING_PROPERTIES')
def signingProps = new Properties()
if (signingFile) { file(signingFile).withInputStream { signingProps.load(it) } }
def dateFixFile = System.getenv('KASADENGE_DATEFIX_SIGNING_PROPERTIES')
def dateFixProps = new Properties()
if(dateFixFile) { file(dateFixFile).withInputStream { dateFixProps.load(it) } }
android {
 namespace 'tr.kasadenge.app'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'tr.kasadenge.app'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.0.5'; manifestPlaceholders = [appLabel: 'İşletmem Kasa']; testInstrumentationRunner 'tr.kasadenge.app.CashInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { if(dateFixFile) { dateFix { storeFile file(dateFixProps['storeFile']); storePassword dateFixProps['storePassword']; keyAlias dateFixProps['keyAlias']; keyPassword dateFixProps['keyPassword'] } }; if(signingFile) { release { storeFile file(signingProps['storeFile']); storePassword signingProps['storePassword']; keyAlias signingProps['keyAlias']; keyPassword signingProps['keyPassword'] } } }
 buildTypes {
  release { minifyEnabled false; if(signingFile) signingConfig signingConfigs.release }
  dateFix { initWith release; applicationIdSuffix '.tarih'; manifestPlaceholders = [appLabel: 'İşletmem Kasa · Tarih']; if(dateFixFile) signingConfig signingConfigs.dateFix }
 }
}

dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }
