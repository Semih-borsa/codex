plugins { id 'com.android.application' }
android {
    namespace 'com.semih.nova'
    compileSdk 35
    ndkVersion '27.2.12479018'
    if (System.getenv('NOVA_NDK_PATH')) ndkPath System.getenv('NOVA_NDK_PATH')
    defaultConfig {
        applicationId 'com.semih.nova'; minSdk 26; targetSdk 35
        versionCode 3; versionName '1.2.0'
        testInstrumentationRunner 'com.semih.nova.ReadinessInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_BUILD_TYPE=Release'; cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') { exclude group: 'org.bouncycastle' }
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
